<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Create your developer account | Windows Developer Program</title>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="signup.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ============ MSA SIGN-IN (shown first) ============ -->
  <div class="signin" id="signin">
    <div class="signin__card">
      <div class="signin__logo">
        <svg width="22" height="22" viewBox="0 0 23 23" aria-hidden="true">
          <rect x="1" y="1" width="10" height="10" fill="#F25022" />
          <rect x="12" y="1" width="10" height="10" fill="#7FBA00" />
          <rect x="1" y="12" width="10" height="10" fill="#00A4EF" />
          <rect x="12" y="12" width="10" height="10" fill="#FFB900" />
        </svg>
        <span>Microsoft</span>
      </div>
      <h1>Sign in</h1>
      <p class="signin__sub">to create your developer account</p>

      <button class="msa-tile" id="msaTile">
        <span class="avatar">AT</span>
        <span class="msa-tile__meta">
          <strong>Alex Taylor</strong>
          <span>alex.taylor@outlook.com</span>
        </span>
        <iconify-icon class="msa-tile__chev" icon="fluent:chevron-right-16-regular" width="16" height="16" aria-hidden="true"></iconify-icon>
      </button>
      <button class="msa-tile msa-tile--ghost" id="msaOther">
        <span class="avatar avatar--ghost">+</span>
        <span class="msa-tile__meta"><strong>Use another account</strong></span>
      </button>

      <p class="signin__note">Microsoft account · demo sign-in</p>
    </div>
  </div>

  <!-- ============ ACCOUNT CREATION — same chrome as the WDP portal ============ -->
  <div id="wiz" hidden>
    <!-- top app bar (same as the portal) -->
    <header class="appbar">
      <a class="brand" href="wdp-marketing.html" aria-label="Microsoft Windows Developer Program">
        <svg class="brand__logo" width="20" height="20" viewBox="0 0 23 23" aria-hidden="true">
          <rect x="1" y="1" width="10" height="10" fill="#F25022" />
          <rect x="12" y="1" width="10" height="10" fill="#7FBA00" />
          <rect x="1" y="12" width="10" height="10" fill="#00A4EF" />
          <rect x="12" y="12" width="10" height="10" fill="#FFB900" />
        </svg>
        <span class="brand__name">Microsoft</span>
        <span class="brand__divider" aria-hidden="true"></span>
        <span class="brand__sub">Windows Developer Program</span>
      </a>
      <div class="appbar__right">
        <span class="avatar" role="img" aria-label="Alex Taylor" title="Alex Taylor">AT</span>
      </div>
    </header>

    <div class="shell">
      <!-- left rail (same sidebar as the portal) — holds the step list -->
      <aside class="sidebar" aria-label="Account setup steps">
        <div class="wiz-rail">
          <div class="wiz-rail__intro">
            <h2>Become a Verified Developer</h2>
            <p>Two steps: create your developer account, then submit a signed binary to earn your Blue Badge.</p>
          </div>
          <div class="wsteps" id="wsteps"><!-- rendered by signup.js --></div>
        </div>
        <div class="snav snav--foot">
          <a href="#"><iconify-icon icon="fluent:question-circle-20-regular" width="20" height="20" aria-hidden="true"></iconify-icon>Get support</a>
          <a href="wdp-marketing.html"><iconify-icon icon="fluent:home-20-regular" width="20" height="20" aria-hidden="true"></iconify-icon>Back to home</a>
        </div>
      </aside>

      <!-- main content -->
      <main class="main wiz-shell" id="main">
        <div class="wiz-page">
          <div class="wiz-head">
            <h1 id="wizTitle"></h1>
            <p class="muted" id="wizSub"></p>
          </div>
          <div id="wizBody"><!-- rendered by signup.js --></div>
        </div>
        <div class="wiz-nav" id="wizFootbar"><!-- rendered by signup.js --></div>
      </main>
    </div>
  </div>

  <!-- Fluent 2 web components (real components + dark theme tokens) -->
  <script type="module">
    import { setTheme, FluentDesignSystem, ButtonDefinition, TextInputDefinition } from 'https://esm.sh/@fluentui/web-components@3.0.0-rc.27';
    import { webDarkTheme } from 'https://esm.sh/@fluentui/tokens';
    setTheme(webDarkTheme);
    ButtonDefinition.define(FluentDesignSystem.registry);
    TextInputDefinition.define(FluentDesignSystem.registry);
  </script>
  <script src="signup.js"></script>
</body>
</html>
